name: liquibase-rollback

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Seleccione ambiente"
        required: true
        type: choice
        options: [dev, qa, prod]
      db_name:
        description: "Nombre de la base de datos"
        required: true
        type: string
      rollback_type:
        description: "Tipo de reversión"
        required: true
        type: choice
        options: [rollback_count,rollback_one_update,rollback_one_changeset]
      rollback_count:
        description: "Cantidad de changesets a revertir (rollback count)"
        required: false
        type: number
      rollback_deployment_id:
        description: "ID de despliegue para reversión (rollback one update)"
        required: false
        type: string
      rollback_changeset_id:
        description: "ID del changeset para reversión (rollback one changeset)"
        required: false
        type: string
      rollback_changeset_author:
        description: "Autor del changeset para reversión (rollback one changeset)"
        required: false
        type: string
      rollback_changeset_path:
        description: "Ruta del changeset para reversión (rollback one changeset)"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

env:
  # ASmith: Modified BIN
  DB_NAME: ${{ inputs.db_name }}
  TARGET_ENV: ${{ inputs.target_env }}
  LB_BIN: "/opt/liquibase/liquibase/liquibase"
  LIQUIBASE_SEARCH_PATH: "."
  LIQUIBASE_COMMAND_CHANGELOG_FILE: "liquibase_master.xml"
  LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: "public"
  LIQUIBASE_LIQUIBASE_SCHEMA_NAME: "public"
  LIQUIBASE_CHANGELOG_LOCK_WAIT_TIME_IN_MINUTES: 2
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}
  LIQUIBASE_MIRROR_OUTPUT_TO_CONSOLE: true
  LIQUIBASE_SHOW_BANNER: false
  LIQUIBASE_LOG_LEVEL: "WARNING"
  ROLLBACK_TYPE: ${{ inputs.rollback_type }}
  ROLLBACK_COUNT: ${{ inputs.rollback_count }}
  ROLLBACK_DEPLOYMENT_ID: ${{ inputs.rollback_deployment_id }}
  ROLLBACK_CHANGESET_ID: ${{ inputs.rollback_changeset_id }}
  ROLLBACK_CHANGESET_AUTHOR: ${{ inputs.rollback_changeset_author }}
  ROLLBACK_CHANGESET_PATH: ${{ inputs.rollback_changeset_path }}

jobs:
  liquibase:
    name: Rollback Liquibase against AWS RDS Postgres
    runs-on: [self-hosted, aws-deuna-liquibase]
    environment: ${{ inputs.target_env }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
 
      - name: Install jq (if needed)
        shell: bash
        run: |
          set -euo pipefail
          
          if ! command -v jq >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -y && sudo apt-get install -y jq
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y jq
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y jq
            else
              echo "No supported package manager (apt/yum/dnf). Install jq manually." && exit 1
            fi
          fi
          
          jq --version
        
      - name: Validate Rollback inputs
        shell: bash
        run: |
          echo "Environment: $TARGET_ENV"
          echo "Database: $DB_NAME"
          echo "Rollback type: $ROLLBACK_TYPE"
          
          if [ "${ROLLBACK_TYPE}" == "rollback_count" ]; then
            echo "Rollback count: ${ROLLBACK_COUNT}"
            if [ -z "${ROLLBACK_COUNT}" ] || [ "${ROLLBACK_COUNT}" -lt 1 ]; then
              echo "ERROR: ROLLBACK_COUNT must be a number >= 1."
              exit 1
            fi
          elif [ "${ROLLBACK_TYPE}" == "rollback_one_update" ]; then
            echo "Rollback one update - Deployment ID: ${ROLLBACK_DEPLOYMENT_ID}"
          elif [ "${ROLLBACK_TYPE}" == "rollback_one_changeset" ]; then
            echo "Rollback one changeset - Author: ${ROLLBACK_CHANGESET_AUTHOR}, ID: ${ROLLBACK_CHANGESET_ID}, Path: ${ROLLBACK_CHANGESET_PATH}"
            if [ -z "${ROLLBACK_CHANGESET_AUTHOR}" ] || [ -z "${ROLLBACK_CHANGESET_ID}" ] || [ -z "${ROLLBACK_CHANGESET_PATH}" ]; then
              echo "ERROR: ROLLBACK_CHANGESET_AUTHOR, ROLLBACK_CHANGESET_ID, and ROLLBACK_CHANGESET_PATH must all be non-empty."
              exit 1
            fi
          else
            echo "ERROR: Invalid rollback type '${ROLLBACK_TYPE}'. Must be one of: rollback_count, rollback_one_update, rollback_one_changeset."
            exit 1
          fi
 
      - name: "Sanity check Liquibase + JDBC"
        shell: bash
        run: |
          
          set -euo pipefail
          
          test -x "${LB_BIN}"
          "${LB_BIN}" --version
 
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch DB params from Secrets Manager -> env
        shell: bash
        env:
          GH_DB_HOST:     ${{ secrets.DB_HOST }}
          GH_DB_PORT:     ${{ secrets.DB_PORT }}
          GH_DB_USER:     ${{ secrets.DB_USER }}
          GH_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          SECRET_JSON=""
          if aws secretsmanager get-secret-value \
              --secret-id "${{ vars.SECRET_NAME }}" \
              --query SecretString \
              --output text >/tmp/secret_string 2>/dev/null; then
            SECRET_JSON="$(cat /tmp/secret_string)"
          fi
          get_json() {
            local key="$1"
            if [ -n "${SECRET_JSON:-}" ] && echo "$SECRET_JSON" | jq -e . >/dev/null 2>&1; then
              echo "$SECRET_JSON" | jq -r --arg k "$key" '.[$k] // empty'
            else
              echo ""
            fi
          }

          DB_HOST="$(get_json host)"
          DB_PORT="$(get_json port)"
          DB_USER="$(get_json username)"
          DB_PASSWORD="$(get_json password)"
 
          [ -n "${DB_HOST:-}" ]     && [ "${DB_HOST:-}" != "null" ]     || DB_HOST="${GH_DB_HOST:-}"
          [ -n "${DB_PORT:-}" ]     && [ "${DB_PORT:-}" != "null" ]     || DB_PORT="${GH_DB_PORT:-}"
          [ -n "${DB_USER:-}" ]     && [ "${DB_USER:-}" != "null" ]     || DB_USER="${GH_DB_USER:-}"
          [ -n "${DB_PASSWORD:-}" ] && [ "${DB_PASSWORD:-}" != "null" ] || DB_PASSWORD="${GH_DB_PASSWORD:-}"
          missing=0
          for v in DB_HOST DB_PORT DB_USER DB_PASSWORD; do
            if [ -z "${!v:-}" ] || [ "${!v:-}" = "null" ]; then
              echo "ERROR: No se encuentra el parametro requerido: $v (No en AWS Secret, No en GitHub Secrets)" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "::add-mask::$DB_HOST"
          echo "::add-mask::$DB_PORT"
          echo "::add-mask::$DB_USER"
          echo "::add-mask::$DB_PASSWORD"
          {

            echo "DB_HOST=$DB_HOST"
            echo "DB_PORT=$DB_PORT"
            echo "DB_USER=$DB_USER"
            echo "DB_PASSWORD=$DB_PASSWORD"
          } >> "$GITHUB_ENV"
 
      - name: "Precheck connectivity (TCP)"
        shell: bash
        run: |
          set -euo pipefail
          echo "==> Connectivity precheck (TCP)"
          getent hosts "${DB_HOST}" || true
          if timeout 5 bash -c "cat < /dev/null > /dev/tcp/${DB_HOST}/${DB_PORT}" ; then
            echo "OK: ${DB_HOST}:${DB_PORT} reachable"
            exit 0
          fi
          if timeout 5 nc -vz "${DB_HOST}" "${DB_PORT}" ; then
            echo "OK (nc): ${DB_HOST}:${DB_PORT} reachable"
            exit 0
          fi
          echo "FAIL: cannot reach ${DB_HOST}:${DB_PORT}"
          exit 1
 
      - name: "Debug: confirm main commit + repo tree"
        shell: bash
        run: |
           set -euo pipefail
           echo "ref: $GITHUB_REF"
           echo "sha: $GITHUB_SHA"
           echo "DB_NAME=$DB_NAME"
           git --version
           echo "HEAD:"
           git rev-parse HEAD
           echo "Top level:"
           git rev-parse --show-toplevel
           echo "Does git tree contain db/${DB_NAME}?"
           git ls-tree -d --name-only HEAD "db/${DB_NAME}" || true
           echo "Does git tree contain db/${DB_NAME}/changelogs?"
           git ls-tree -d --name-only HEAD "db/${DB_NAME}/changelogs" || true
           echo "First 200 paths under db/${DB_NAME}/changelogs:"
           git ls-tree -r --name-only HEAD "db/${DB_NAME}/changelogs" | sed -n '1,200p'
 
      - name: "Checking repo structure"
        shell: bash
        run: |
           set -euo pipefail
           base="${GITHUB_WORKSPACE}/db/${DB_NAME}"
           must_file() { [ -f "$1" ] || { echo "MISSING FILE: $1"; exit 1; }; }
           must_dir() { [ -d "$1" ] || { echo "MISSING DIR : $1"; exit 1; }; }
           echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
           echo "Base path=$base"
           must_dir "$base"
           echo "Listing base:"
           ls -la "$base"
           must_dir "$base/changelogs"
           echo "Listing changelogs:"
           ls -la "$base/changelogs" || true
           echo "DEBUG: changelogs entries (escaped):"
           for p in "$base/changelogs"/*; do printf ' - %q\n' "$p"; done
           # Root file
           must_file "$base/liquibase_master.xml"
           # Changelog files (case-insensitive)
           incr_file="$(find "$base/changelogs" -maxdepth 1 -type f -iname 'incremental.xml' -print -quit || true)"
           rep_file="$(find "$base/changelogs" -maxdepth 1 -type f -iname 'repeatable.xml'  -print -quit || true)"
           [ -n "$incr_file" ] || { echo "MISSING FILE: changelogs/incremental.xml"; exit 1; }
           [ -n "$rep_file"  ] || { echo "MISSING FILE: changelogs/repeatable.xml"; exit 1; }
           # Changelog directories (case-insensitive)
           incr_dir="$(find "$base/changelogs" -maxdepth 1 -type d -iname 'incremental' -print -quit || true)"
           rep_dir="$(find "$base/changelogs" -maxdepth 1 -type d -iname 'repeatable'  -print -quit || true)"
           [ -n "$incr_dir" ] || { echo "MISSING DIR : changelogs/incremental"; exit 1; }
           [ -n "$rep_dir"  ] || { echo "MISSING DIR : changelogs/repeatable"; exit 1; }
 
           echo "Repo structure sanity check: OK"

      - name: Rollback (history before + rollback + history after)
        shell: bash
        run: |
            set -euo pipefail
   
            # Normaliza a nombre de carpeta (evita espacios / caracteres raros)
            DB_DIR="$(echo "${DB_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g')"
            WORKDIR="${GITHUB_WORKSPACE}/db/${DB_DIR}"
   
            if [ ! -d "${WORKDIR}" ]; then
              echo "ERROR: No existe el directorio ${WORKDIR}"
              echo "Contenido de db/:"
              ls -la "${GITHUB_WORKSPACE}/db" || true
              exit 1
            fi
   
            if [ ! -f "${WORKDIR}/${LIQUIBASE_COMMAND_CHANGELOG_FILE}" ]; then
              echo "ERROR: No existe changelog ${WORKDIR}/${LIQUIBASE_COMMAND_CHANGELOG_FILE}"
              ls -la "${WORKDIR}" || true
              exit 1
            fi
   
            ART_DIR="${RUNNER_TEMP}/artifacts"
            mkdir -p "${ART_DIR}"
            export ART_DIR="${ART_DIR}"
            export LIQUIBASE_COMMAND_URL="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
            export LIQUIBASE_COMMAND_USERNAME="${DB_USER}"
            export LIQUIBASE_COMMAND_PASSWORD="${DB_PASSWORD}"
   
            cd "${WORKDIR}"
            "${LB_BIN}" flow --flow-file=../liquibase-rollback.flowfile.yaml 2>&1 | tee ${ART_DIR}/liquibase_rollback.log
       
      - name: Upload Liquibase artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquibase-rollback-artifacts
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: warn
